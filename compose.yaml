services:
  debate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zhibian-debate
    restart: unless-stopped
    ports:
      - "127.0.0.1:4186:80"
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://127.0.0.1/
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
